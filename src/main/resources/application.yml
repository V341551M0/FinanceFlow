server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: financeflow-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financeflow}
    username: ${DB_USER:financeflow}
    password: ${DB_PASSWORD:financeflow}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    time-zone: America/Sao_Paulo
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

financeflow:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-override-with-a-256-bit-key-1234567890}
    expiration-ms: 86400000          # 24h
    refresh-expiration-ms: 604800000 # 7d
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.financeflow: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:16:///financeflow
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

financeflow:
  market:
    brapi:
      token: ${BRAPI_TOKEN:}
    coingecko:
      api-key: ${COINGECKO_API_KEY:}