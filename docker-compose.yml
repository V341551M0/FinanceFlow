services:
  db:
    image: postgres:16-alpine
    container_name: financeflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financeflow}
      POSTGRES_USER: ${DB_USER:-financeflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-financeflow}
    ports:
      - "5432:5432"
    volumes:
      - financeflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-financeflow} -d ${POSTGRES_DB:-financeflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-financeflow}
      DB_USER: ${DB_USER:-financeflow}
      DB_PASSWORD: ${DB_PASSWORD:-financeflow}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-override-with-a-256-bit-key-1234567890}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: financeflow-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  financeflow_pgdata:
